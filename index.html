<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScamSOS India</title>
<style>
:root{--bg:#f2f6f8;--card:#fff;--ink:#11202b;--mut:#5a6b78;--line:#d9e2e8;--teal:#0f6b6b;--tealbg:#e3f2f1;--red:#c8281e;--warn:#fff3e0;--warnl:#eec27a;--shadow:0 1px 2px rgba(17,32,43,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e171d;--card:#16232b;--ink:#eaf1f5;--mut:#9fb0bb;--line:#2a3b46;--teal:#4fc3bd;--tealbg:#14302f;--red:#e5483d;--warn:#2b2214;--warnl:#6b5223;--shadow:none}}
:root[data-theme="dark"]{--bg:#0e171d;--card:#16232b;--ink:#eaf1f5;--mut:#9fb0bb;--line:#2a3b46;--teal:#4fc3bd;--tealbg:#14302f;--red:#e5483d;--warn:#2b2214;--warnl:#6b5223;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-color:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
header b{font-size:17px;letter-spacing:.2px}
.calmb{border:1px solid var(--teal);background:var(--tealbg);color:var(--teal);font-weight:600;border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:28px;line-height:1.15;margin:8px 0 6px;font-weight:800}
h2{font-size:19px;margin:22px 0 8px}
p{margin:0 0 10px}.mut{color:var(--mut);font-size:14px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 10px;color:var(--ink);font:inherit;cursor:pointer;box-shadow:var(--shadow)}
.opt:active{transform:scale(.99)}
.opt .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--tealbg);color:var(--teal);display:grid;place-items:center;font-size:20px;font-weight:800}
.opt b{display:block}.opt small{color:var(--mut);font-size:14px}
.note{background:var(--warn);border:1px solid var(--warnl);border-radius:12px;padding:12px 14px;margin:12px 0}
.step{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 10px}
.step.done{opacity:.55}.step input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--teal)}
.step b{display:block}.step p{margin:2px 0 8px;color:var(--mut);font-size:15px}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;background:var(--teal);color:#fff;text-decoration:none;cursor:pointer}
.btn.sec{background:transparent;color:var(--teal);border:1px solid var(--teal)}
.btn.red{background:var(--red)}
body[data-theme] .btn{color:#fff}
.dont{background:var(--card);border:1px solid var(--red);border-radius:14px;padding:6px 14px 6px 34px;margin:0}
.dont li{margin:8px 0}
.back{background:none;border:0;color:var(--teal);font:inherit;font-weight:600;padding:6px 0;cursor:pointer}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input[type=text],input[type=tel],input[type=datetime-local],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:90px}
pre{white-space:pre-wrap;word-break:break-word;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bar a{display:flex;justify-content:center;align-items:center;gap:10px;max-width:560px;margin:0 auto;background:var(--red);color:#fff;text-decoration:none;font-weight:800;font-size:19px;border-radius:14px;padding:15px}
.bar small{display:block;text-align:center;color:var(--mut);font-size:12px;margin-top:4px}
#calm{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#calm.on{display:flex}
.orb{width:150px;height:150px;border-radius:50%;background:var(--tealbg);border:3px solid var(--teal);animation:br 8s ease-in-out infinite;margin-bottom:24px}
@keyframes br{0%,100%{transform:scale(.7)}50%{transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}
#voice{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
#voice.on{display:flex}
.vh{display:flex;justify-content:space-between;align-items:center}
#vlog{flex:1;overflow:auto}
.vm{padding:10px 12px;border-radius:12px;margin:6px 0;max-width:88%}
.vm.bot{background:var(--tealbg)}
.vm.me{background:var(--card);border:1px solid var(--line);margin-left:auto}
#vtxt{flex:1;min-width:0;width:auto}
#vcall{text-align:center;font-size:18px;padding:14px}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
body{font-size:17px}
h1{font-family:"Iowan Old Style",Georgia,"Times New Roman",serif;font-weight:700}
input,select,textarea{font-size:17px!important}
.hero{background:#0b3b3c;color:#f2faf9;border-radius:22px;padding:22px 20px;margin:4px 0 8px}
.hero h1{font-size:30px;line-height:1.15;margin:0 0 8px}
.hero p{color:#bfe0dd;margin:0 0 16px}
.hero .btn:not(.red){background:#fff;color:#0b3b3c}
.btn.big{padding:14px 18px;font-size:17px;border-radius:14px}
.opt{padding:16px;border-radius:18px}
.opt .ic{width:48px;height:48px;font-size:22px;border-radius:14px}
.step{border-radius:18px;padding:16px}.step input{width:26px;height:26px}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--teal);transition:width .3s}
.vorb{width:96px;height:96px;border-radius:50%;margin:4px auto;background:var(--tealbg);border:3px solid var(--teal)}
.vorb.listening{animation:pulse 1.4s ease-in-out infinite;background:var(--teal)}
.vorb.speaking{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.9)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.vorb{animation:none!important}}
.chip{border:1px solid var(--teal);background:var(--tealbg);color:var(--teal);border-radius:999px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
@media print{.thumb{width:240px;height:auto}}
#vlang{width:auto!important;padding:6px 8px;font-size:15px!important}
.foot{font-size:13px;color:var(--mut);margin-top:20px}
@media print{header,.bar,.noprint,#calm{display:none!important}main{padding:0}pre{border:0}}
</style>
</head>
<body>
<header class="noprint"><b>ScamSOS India</b><span class="row" style="flex-wrap:nowrap"><a class="calmb" href="account.html" style="text-decoration:none">Account</a><button class="calmb" data-voice="open">Talk</button><button class="calmb" data-calm="1">Calm down</button></span></header>
<main id="app"></main>
<div class="bar noprint"><a href="tel:1930">Call 1930 now</a><small>National Cyber Crime Helpline</small></div>
<div id="calm" role="dialog" aria-label="Calm down">
<div class="orb"></div>
<h1 id="cb">Breathe in</h1>
<p style="max-width:320px">It is okay. Many people go through this, and acting quickly is what matters. You do not need to do everything at once.</p>
<button class="btn" data-calm="0">I'm ready. Continue</button>
</div>
<div id="voice" role="dialog" aria-label="Voice assistant">
<div class="vh"><b>Voice assistant</b><span class="row" style="flex-wrap:nowrap;align-items:center"><select id="vlang" aria-label="Language"><option value="en-IN">English</option><option value="hi-IN">हिन्दी</option></select><button class="back" data-voice="close">Close</button></span></div>
<div id="vlog" aria-live="polite"></div>
<div id="vorb" class="vorb"></div>
<p id="vstat" class="mut" style="text-align:center;margin:0"></p>
<div class="row" id="vchips"><button class="chip" data-voice="chip" data-t="I sent money to a scammer">I sent money</button><button class="chip" data-voice="chip" data-t="My phone may be hacked">Phone hacked</button><button class="chip" data-voice="chip" data-t="I shared my OTP">Shared OTP</button><button class="chip" data-voice="chip" data-t="I clicked a link">Clicked a link</button></div>
<p id="vcrisis" hidden><a class="btn" href="tel:14416">Call Tele-MANAS 14416</a></p>
<div class="row" style="flex-wrap:nowrap"><input type="text" id="vtxt" placeholder="Or type here" aria-label="Type your reply"><button class="btn sec" data-voice="send">Send</button><button class="btn sec" data-voice="mic">Mic</button></div>
<a id="vcall" class="btn red" href="tel:1930">Call 1930 now</a>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CALL={l:'Call 1930',h:'tel:1930'};
const PORTAL={l:'Open cybercrime.gov.in',h:'https://cybercrime.gov.in'};
const TYPES=[
{id:'upi',ic:'₹',title:'Money was sent or taken',sub:'UPI, bank transfer or card payment to a scammer',
now:[
{t:'Call 1930',d:'The sooner it is reported, the better the chance of freezing the money. Keep the transaction ID and amount ready.',a:CALL},
{t:'Tell your bank or UPI app',d:'Use the number on your card or inside your bank\'s official app. Ask them to block the transaction, raise a dispute, and block your card or UPI if needed.'},
{t:'Report on the cybercrime portal',d:'File the complaint and note the acknowledgement number.',a:PORTAL},
{t:'Save your proof',d:'Screenshot the payment, the chat, and the scammer\'s number or UPI ID. Do not delete anything.',go:'proof'},
{t:'Prepare your report and bank letter',d:'Answer a few questions and we will write both for you.',go:1}],
dont:['Do not pay anyone who offers to "recover" your money.','Do not call numbers you found on Google or got from the scammer.','Do not delete chats, SMS or call logs.','Do not send any more money, even a small "release fee".']},
{id:'phone',ic:'📱',title:'My phone may be hacked',sub:'Someone has remote access, or I installed a strange app',
now:[
{t:'Turn off mobile data and Wi-Fi',d:'This cuts the scammer\'s access. Normal voice calls still work. Do this first.'},
{t:'Call 1930',d:'Tell them a remote-access app may be on your phone.',a:CALL},
{t:'Take screenshots of what you see',d:'Save the suspicious app, messages and any payments before removing anything.',go:'proof'},
{t:'Remove remote-access apps',d:'Look for AnyDesk, TeamViewer, QuickSupport or apps you did not choose. Uninstall them after your screenshots.'},
{t:'Call your bank from the official number',d:'Ask them to block cards, UPI and net banking until you are safe.'},
{t:'Change passwords from another device',d:'Start with email, bank and UPI. Then prepare your report.',go:1}],
dont:['Do not keep the phone online while the scammer may be watching.','Do not log in to your bank on this phone until it is cleaned.','Do not share your screen or install anything the caller asks for.','Do not factory reset before you have saved proof.']},
{id:'otp',ic:'🔑',title:'I shared an OTP, PIN or card details',sub:'Someone asked on a call or message and I gave it',
now:[
{t:'Call your bank right now',d:'Use the number on your card or in the official app. Ask them to block the card, UPI and net banking immediately.'},
{t:'Call 1930',d:'Report the fraud, even if money has not left yet.',a:CALL},
{t:'Change your UPI PIN and net banking password',d:'Do this only after the bank has blocked access, from a safe device.'},
{t:'Save proof and file the report',d:'Keep the number that called or messaged you.',go:1}],
dont:['Do not share any more OTPs, PINs or CVV, whoever asks.','Do not trust a caller who says they are from the bank. Hang up and call the official number.','Do not click any links they send now.']},
{id:'link',ic:'🔗',title:'I clicked a link or fake KYC / app',sub:'A message, website or app asked me to log in or pay',
now:[
{t:'Turn off mobile data and Wi-Fi',d:'If you installed an app, cut its connection first.'},
{t:'Do not enter anything more',d:'Close the page. If you already typed a password or card details, treat them as stolen.'},
{t:'Call your bank',d:'Use the official number. Ask them to watch or block your account and cards.'},
{t:'Call 1930 if money moved or you shared details',d:'Report it as soon as possible.',a:CALL},
{t:'Report the message',d:'Report the suspicious message or number on Sanchar Saathi (Chakshu), within 30 days. If money was lost, use 1930 instead.',a:{l:'Open Sanchar Saathi',h:'https://sancharsaathi.gov.in'},go:1}],
dont:['Do not click the link again to "check".','Do not forward the message to others.','Do not reuse that password anywhere else.']}
];
let view='home',cur=null,done={};
const go=(v,c)=>{view=v==='proof'?'report':v;cur=c||null;render();scrollTo(0,0);if(v==='proof'){const b=$('#pblock');b&&b.scrollIntoView()}};
function render(){const a=$('#app');a.innerHTML=view==='home'?home():view==='type'?typeV():reportV();if(view==='report')prefill()}
function prefill(){['amt','scam','bank','utr'].forEach(k=>{if(rep[k]&&$('#'+k))$('#'+k).value=rep[k]});if(rep.type&&$('#type'))$('#type').value=rep.type;if(rep.what&&$('#what'))$('#what').value=rep.what+(rep.when?' (When: '+rep.when+')':'')}
function home(){return `<section class="hero"><h1>You are not alone. We will do this one step at a time.</h1><p>If money was taken, the first hour matters most. Start with either option.</p><div class="row"><button class="btn big" data-voice="open">🎙️ Talk to me</button><a class="btn big red" href="tel:1930">Call 1930</a></div></section>
<h2>Or choose what happened</h2>
${TYPES.map(t=>`<button class="opt" data-type="${t.id}"><span class="ic">${t.ic}</span><span><b>${esc(t.title)}</b><small>${esc(t.sub)}</small></span></button>`).join('')}
<button class="opt" data-go="proof"><span class="ic">📎</span><span><b>Save your proof</b><small>Screenshots, messages and a timeline</small></span></button>
<button class="opt" data-go="report"><span class="ic">📄</span><span><b>Make my report and bank letter</b><small>Fill in the details once, copy or save as PDF</small></span></button>
<h2>Report officially</h2><div class="step"><div><b>Real reporting links</b><p>1930 and cybercrime.gov.in are for money lost. Sanchar Saathi is for suspicious calls, SMS or WhatsApp. RBI Ombudsman is only if your bank has not fixed it within 30 days.</p><div class="row"><a class="btn sec" href="https://cybercrime.gov.in" target="_blank" rel="noopener">cybercrime.gov.in</a><a class="btn sec" href="https://sancharsaathi.gov.in" target="_blank" rel="noopener">Sanchar Saathi</a><a class="btn sec" href="https://cms.rbi.org.in" target="_blank" rel="noopener">RBI Ombudsman</a></div></div></div>
<p class="foot">An independent guide, not a government service. Your report details stay on your phone unless you choose Save to my account. Voice input uses your browser's speech service, which may send your voice to its provider (Chrome sends it to Google). Inside Claude, Talk also sends what you say to Claude so it can reply. Helplines and portals should be re-verified against official sources before public launch. <a href="how-it-works.html" style="color:var(--teal);font-weight:600">How this app works</a></p>`}
function typeV(){const t=TYPES.find(x=>x.id===cur);const d=done[cur]||(done[cur]={});
return `<button class="back" data-go="home">← Back</button><h1>${esc(t.title)}</h1>
<div class="prog"><i style="width:${Math.round(100*t.now.filter((s,i)=>d[i]).length/t.now.length)}%"></i></div><p class="mut">${t.now.filter((s,i)=>d[i]).length} of ${t.now.length} steps done</p>
<h2>Do this now</h2>
${t.now.map((s,i)=>`<div class="step ${d[i]?'done':''}"><input type="checkbox" data-chk="${i}" ${d[i]?'checked':''} aria-label="Done"><div><b>${esc(s.t)}</b><p>${esc(s.d)}</p><div class="row">${s.a?`<a class="btn ${s.a.h==='tel:1930'?'red':''}" href="${s.a.h}" target="_blank" rel="noopener">${esc(s.a.l)}</a>`:''}${s.go?`<button class="btn sec" data-go="${s.go===1?'report':s.go}">${s.go===1?'Make my report':'Add my proof'}</button>`:''}</div></div></div>`).join('')}
<h2>Do not</h2><ul class="dont">${t.dont.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
function reportV(){const o=TYPES.map(t=>`<option>${esc(t.title)}</option>`).join('');
return `<button class="back" data-go="home">← Back</button><h1>Your report</h1>
<p class="mut">Fill what you know. Leave the rest blank. You can read this out on the 1930 call.</p>
<div class="noprint">
<label>Your name</label><input type="text" id="name"><label>Your mobile number</label><input type="tel" id="phone">
<label>What happened</label><select id="type">${o}</select>
<label>Date and time</label><input type="datetime-local" id="when">
<label>Amount lost (₹)</label><input type="text" id="amt" inputmode="numeric">
<label>Your bank</label><input type="text" id="bank"><label>Last 4 digits of your account or card</label><input type="text" id="last4" maxlength="4" inputmode="numeric">
<label>Transaction ID / UTR</label><input type="text" id="utr">
<label>Scammer's phone, UPI ID, website or app</label><input type="text" id="scam">
<label>Complaint number (if you already have one)</label><input type="text" id="ack">
<label>Describe what happened in your words</label><textarea id="what"></textarea>
<div id="pblock">${proofBlock()}</div>
<p style="margin-top:14px"><button class="btn" data-gen="1">Create my report</button></p></div>
<div id="out"></div>`}
function gen(){try{localStorage.setItem('scamsos_draft',JSON.stringify(['name','phone','type','when','amt','bank','last4','utr','scam','ack','what'].reduce((o,k)=>(o[k]=$('#'+k).value||'',o),{timeline:rep.timeline||''})))}catch(e){}
const v=i=>($('#'+i).value||'').trim()||'__________';
const w=v('when').replace('T',' ');
const sum=`CYBER FRAUD REPORT (SUMMARY)
Name: ${v('name')}
Mobile: ${v('phone')}
Type of incident: ${v('type')}
Date and time: ${w}
Amount lost: Rs ${v('amt')}
Bank: ${v('bank')} (account/card ending ${v('last4')})
Transaction ID / UTR: ${v('utr')}
Scammer details: ${v('scam')}
Existing complaint no.: ${v('ack')}

What happened:
${v('what')}

Timeline:
${rep.timeline||'__________'}

Proof attached: ${PITEMS.filter((p,i)=>(proof[i]||[]).length).map(p=>p[0]).join(', ')||'none yet'}`;
const let_=`To,
The Branch Manager / Nodal Officer
${v('bank')}

Subject: Fraudulent transaction of Rs ${v('amt')} - request to block, hold and investigate

Dear Sir/Madam,

I, ${v('name')} (mobile ${v('phone')}), hold an account/card ending ${v('last4')} with your bank. On ${w} I became a victim of cyber fraud: ${v('what')}

A transaction of Rs ${v('amt')} (Transaction ID/UTR: ${v('utr')}) was made to: ${v('scam')}. I did not knowingly authorise a genuine payment.

I have reported this to the National Cyber Crime Helpline 1930 (complaint no.: ${v('ack')}). I request you to:
1. Block my card, UPI and net banking if further loss is possible.
2. Place a hold or lien on the amount, and contact the receiving bank.
3. Register my dispute and give me a reference number.
4. Share the status of the investigation in writing.

I am reporting promptly and request that my liability be treated in line with RBI's framework on customer liability for unauthorised electronic banking transactions.

Yours faithfully,
${v('name')}
${v('phone')}`;
$('#out').innerHTML=`<h2>Summary for 1930 and the portal</h2><pre id="p1"></pre><div class="row noprint"><button class="btn sec" data-copy="p1">Copy</button></div>
<h2>Letter to your bank</h2><pre id="p2"></pre><div class="row noprint"><button class="btn sec" data-copy="p2">Copy</button><button class="btn" data-print="1">Save as PDF / Print</button></div>
${proofHtml()}
<p class="noprint"><a class="btn" href="account.html">Save to my account</a></p>
<p class="mut noprint">Open cybercrime.gov.in to file, or read the summary out when you call 1930.</p>`;
$('#p1').textContent=sum;$('#p2').textContent=let_;$('#out').scrollIntoView({behavior:'smooth'})}
function copy(id,btn){const t=$('#'+id).textContent;const ok=()=>{btn.textContent='Copied'};
try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
function fb(){const r=document.createRange();r.selectNodeContents($('#'+id));const s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand('copy');ok()}catch(e){btn.textContent='Select and copy'}}}
let tm;function calm(on){const c=$('#calm');c.classList.toggle('on',on);clearInterval(tm);
if(on){let i=0;const f=()=>{$('#cb').textContent=i++%2?'Breathe out':'Breathe in'};f();tm=setInterval(f,4000)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-type],[data-go],[data-chk],[data-gen],[data-copy],[data-print],[data-calm],[data-voice],[data-clr]');if(!b)return;
const d=b.dataset;
if(d.type)go('type',d.type);else if(d.go)go(d.go);
else if(d.chk!==undefined){(done[cur]||(done[cur]={}))[d.chk]=b.checked;render()}
else if(d.gen)gen();else if(d.copy)copy(d.copy,b);else if(d.print)print();
else if(d.calm!==undefined)calm(d.calm==='1');else if(d.voice)voiceAct(d.voice,d.t);else if(d.clr!==undefined){delete proof[d.clr];refreshProof()}});
const rep={},V=$('#voice'),SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const Q=[['amt','How much money was lost, in rupees?'],['when','When did it happen? Today, yesterday, or a time you remember.'],['scam','What phone number, UPI ID or website did the scammer use? Say skip if you do not know.'],['bank','Which bank or UPI app did you use?']];
const ADV={upi:'Please call 1930 first. Reporting fast gives the best chance of freezing the money.',phone:'First, turn off your mobile data and Wi-Fi. Then call 1930.',otp:'Please call your bank on the number on your card and ask them to block your card and UPI. Then call 1930.',link:'Please do not enter anything more, and turn off your data. If money moved, call 1930.'};
let vOn=false,rec=null,vs='story',qi=0,miss=0;
function vlog(w,t){const d=document.createElement('div');d.className='vm '+w;d.textContent=t;$('#vlog').appendChild(d);d.scrollIntoView({block:'end'})}
function orb(c){$('#vorb').className='vorb '+c}
const LG=()=>$('#vlang').value;let RATE=.95;
function pickV(l){const all=speechSynthesis.getVoices(),p=all.filter(x=>x.lang.replace('_','-')===l);return p.find(x=>/natural|online|neural/i.test(x.name))||p.find(x=>/google|neerja|heera|swara|female/i.test(x.name))||p[0]||all.find(x=>x.lang.startsWith(l.slice(0,2)))}
function say(t,next){vlog('bot',t);lastSay=t;orb('speaking');
try{speechSynthesis.cancel();const parts=t.match(/[^.?!।]+[.?!।]*/g)||[t],l=LG(),v=pickV(l);let i=0;
const nx=()=>{if(i>=parts.length){orb('');next&&next();return}const u=new SpeechSynthesisUtterance(parts[i++].trim());u.lang=l;u.rate=RATE;u.pitch=1.02;if(v)u.voice=v;u.onend=()=>setTimeout(nx,220);u.onerror=()=>{orb('');next&&next()};speechSynthesis.speak(u)};nx()}catch(e){orb('');next&&next()}}
function listen(){if(!vOn)return;if(!SR){$('#vstat').textContent='Voice input is not supported in this browser. Please type below.';return}
let got=false;const me=new SR();rec=me;me.lang=LG();me.interimResults=false;
me.onresult=e=>{got=true;miss=0;handle(e.results[0][0].transcript)};
me.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){rec=null;$('#vstat').textContent='Microphone is blocked. Please type below.'}};
me.onend=()=>{orb('');if(vOn&&!got&&rec===me){if(++miss===2)say(LG()==='hi-IN'?'मैं यहीं हूँ। आराम से बोलिए।':'I am still here. Take your time.',listen);else if(miss<4)listen();else $('#vstat').textContent='Tap Mic to talk, or type below.'}};
$('#vstat').textContent='Listening…';orb('listening');try{me.start()}catch(e){$('#vstat').textContent='Please type below.'}}
function kind(t){return /anydesk|teamviewer|quicksupport|remote|hacked|screen share/.test(t)?'phone':/\botp\b|\bpin\b|cvv|card number|password/.test(t)?'otp':/\blink\b|click|kyc|apk|\bapp\b|website/.test(t)?'link':'upi'}
function getAmt(t,strict){const r=strict?/(?:rs\.?|rupees?|₹)\s*(\d[\d,]*)\s*(lakhs?|thousand|k)?|(\d[\d,]*)\s*(lakhs?|thousand|k)?\s*(?:rs|rupees?|₹)/:/(\d[\d,]*)\s*(lakhs?|thousand|k)?/;const m=t.match(r);if(!m)return'';const g=strict?(m[1]||m[3]):m[1],u=strict?(m[2]||m[4]):m[2];let n=parseFloat(g.replace(/,/g,''));if(u&&/lakh/.test(u))n*=1e5;else if(u)n*=1e3;return isNaN(n)?'':String(Math.round(n))}
let lastSay='',curKind='upi';
const pick=a=>a[Math.floor(Math.random()*a.length)];
function faq(t){const n=t.split(/\s+/).length;if(n>14)return'';
if(/\b(hi|hello|hey|namaste)\b/.test(t)&&n<4)return'Hello. I am here with you. Tell me what happened, in your own words.';
if(/repeat|say that again|what did you say|pardon/.test(t))return lastSay;
if(/thank/.test(t))return'You are welcome. I am here if you need anything else.';
if(/back|recover|refund/.test(t)&&/money|get|will|can/.test(t))return'I cannot promise that, but reporting fast gives the best chance. Banks can sometimes hold money that has not moved on yet. That is why calling 1930 comes first.';
if(/1930/.test(t)&&/what|who/.test(t))return'1930 is the national cyber crime helpline in India. They can alert banks quickly to hold the money.';
if(/scared|afraid|panic|anxious|nervous|stupid|fool|idiot|ashamed|shame|embarrass|my fault|worried/.test(t))return'It is not your fault. Clever people are fooled every day by these scams. Take one slow breath. You are doing the right thing by acting now.';
if(/bank.*(not|refus|ignor)|no reply|not helping/.test(t))return'Ask for a written complaint number. Then write to the bank nodal officer. If there is still no reply, you can escalate to the RBI Ombudsman. The letter in this app can help.';
if(/police|\bfir\b|complaint/.test(t))return'You can report on cybercrime.gov.in or call 1930. For a large loss, you can also visit your local police station with your proof.';
if(/what (should|do) i do|what now|what next|help me|^help$/.test(t))return ADV[curKind]+' Say call to open the dialer.';
return''}
function ask(pre){pre=typeof pre==='string'?pre+' ':'';while(qi<Q.length&&rep[Q[qi][0]])qi++;if(qi>=Q.length){vs='end';say(pre+'That is everything I need. So far I have '+[rep.type,rep.amt&&'Rs '+rep.amt,rep.scam].filter(Boolean).join(', ')+'. Say "make report" and I will fill in your report and bank letter. Or say "call" to ring 1930.',listen)}else say(pre+Q[qi][1],listen)}
function story(raw,t){$('#vchips').hidden=true;const k=kind(t);rep.what=raw;rep.type=TYPES.find(x=>x.id===k).title;const a=getAmt(t,true);if(a)rep.amt=a;curKind=k;vs='details';qi=0;say(pick(['I am so sorry this happened to you.','Thank you for telling me. That sounds really stressful.','I hear you. You did the right thing by speaking up.'])+(a?' I have noted Rs '+a+'.':'')+' '+ADV[k]+' Say "call" any time and I will open the dialer. Or answer a few quick questions first.',ask)}
function store(raw,t){const k=Q[qi][0];let v=raw;if(k==='amt'){v=getAmt(t,false);if(!v)return say('I could not catch the amount. You can fix it in the report. Let us move on.',()=>{qi++;ask()})}else if(k==='scam'){v=/^[\d\s-]{8,}$/.test(raw)?raw.replace(/\D/g,''):raw.replace(/ at /gi,'@').replace(/\s+dot\s+/gi,'.')}rep[k]=v;qi++;ask(pick(['Got it.','Okay, noted.','Thank you.']))}
function callNow(){say('Opening the call to 1930. If the dialer does not open, tap the red button.',()=>{try{$('#vcall').click()}catch(e){}})}
function vclose(){vOn=false;const r=rec;rec=null;try{r&&r.abort()}catch(e){}try{speechSynthesis.cancel()}catch(e){}V.classList.remove('on')}
function handle(raw,re){if(!re)vlog('me',raw);const t=raw.toLowerCase();
if(/suicide|kill myself|end my life|want to die|no point living/.test(t)){$('#vcrisis').hidden=false;return say('I am really sorry you are hurting this much. You do not have to face this alone. Please call Tele-MANAS on 14416 now, or go to someone you trust. Money problems can be dealt with step by step. Your safety comes first.')}
if(t.split(/\s+/).length<=4){
if(/repeat|say (that )?again|what did you say|dobara|phir se/.test(t))return say(lastSay,listen);
if(/\bslow|dheere/.test(t)){RATE=.8;return say('Okay, I will speak slower.',listen)}
if(/\bfaster|\btez/.test(t)){RATE=1.05;return say('Okay, a little faster.',listen)}
if(/\bstop\b|quiet|\bwait\b|ruko/.test(t)){try{speechSynthesis.cancel()}catch(e){}orb('');$('#vstat').textContent='Paused. Tap Mic when you are ready.';return}}
if(/\b(make|create|generate)\b.*\b(report|letter)\b/.test(t)||/^report\b/.test(t)){vclose();return go('report')}
if(/\b(call|dial)\b|1930|helpline/.test(t)&&(!SM||t.split(/\s+/).length<=4))return callNow();
if(!SM){const r=faq(t);if(r)return say(r+(vs==='details'&&qi<Q.length&&!/repeat|again|pardon/.test(t)?' '+Q[qi][1]:''),listen)}
if(SM)return ai(raw);
if(vs==='story')return story(raw,t);
if(vs==='end')return say('Say "make report" to build your report, or "call" to ring 1930.',listen);
if(/\b(skip|not sure|no idea)\b|don'?t know/.test(t)){qi++;return ask()}
store(raw,t)}
function voiceAct(a,tx){
if(a==='open'){Object.keys(rep).forEach(k=>delete rep[k]);hist.length=0;vOn=true;vs='story';qi=0;miss=0;$('#vlog').innerHTML='';$('#vstat').textContent='';$('#vcrisis').hidden=true;$('#vchips').hidden=false;V.classList.add('on');say(LG()==='hi-IN'?'नमस्ते। मैं आपके साथ हूँ। आप अभी सुरक्षित हैं। एक गहरी साँस लीजिए। फिर अपने शब्दों में बताइए कि क्या हुआ।':'Hello. I am here with you. You are safe right now. Take one slow breath with me. Then tell me, in your own words, what happened.',listen)}
else if(a==='close')vclose();
else if(a==='mic'){try{speechSynthesis.cancel()}catch(e){}miss=0;listen()}
else if(a==='send'||a==='chip'){const i=$('#vtxt'),t=a==='chip'?tx:i.value.trim();if(!t)return;i.value='';const r=rec;rec=null;try{r&&r.abort()}catch(e){}try{speechSynthesis.cancel()}catch(e){}handle(t)}}
const PITEMS=[['Payment screenshot','Shows the transaction ID / UTR, amount and time'],['Bank SMS or debit alert','The message from your bank about the money leaving'],['Chats with the scammer','WhatsApp, SMS, Instagram, email or a call recording'],["Scammer's details",'Phone number, UPI ID, profile page or website address'],['Call log','The screen showing their calls or missed calls'],['Bank statement entry','The line in your statement or UPI app history']];
const proof={};
function proofBlock(){return `<h2>Attach your proof</h2>
<div class="note"><b>Do not delete or crop anything.</b> Original screenshots are the best evidence. Files stay on your phone and disappear when you close this page.</div>
${PITEMS.map((p,i)=>{const a=proof[i]||[];return `<div class="step"><div style="flex:1"><b>${esc(p[0])}</b><p>${esc(p[1])}</p><div class="row"><label class="btn sec">Add screenshots<input type="file" accept="image/*" multiple hidden data-file="${i}"></label>${a.length?`<button class="btn sec" data-clr="${i}">Clear (${a.length})</button>`:''}</div><div class="thumbs">${a.map(x=>`<img class="thumb" src="${x.u}" alt="${esc(x.n)}">`).join('')}</div></div></div>`}).join('')}
<h2>Timeline</h2><p class="mut">One line per event, with the time. Example: 2:10 pm - got a call from "bank". 2:25 pm - shared OTP. 2:31 pm - Rs 8,000 debited.</p>
<textarea id="tl">${esc(rep.timeline||'')}</textarea>`}
function refreshProof(){const b=$('#pblock');if(b)b.innerHTML=proofBlock();else render()}
function proofHtml(){const L=PITEMS.map((p,i)=>(proof[i]||[]).length?`<p><b>${esc(p[0])}</b></p><div class="thumbs">${proof[i].map(x=>`<img class="thumb" src="${x.u}" alt="">`).join('')}</div>`:'').join('');return L?`<h2>Proof attached</h2>${L}`:''}
document.addEventListener('change',e=>{const i=e.target.dataset&&e.target.dataset.file;if(i===undefined)return;(proof[i]=proof[i]||[]).push(...[...e.target.files].map(f=>({u:URL.createObjectURL(f),n:f.name})));refreshProof()});
document.addEventListener('input',e=>{if(e.target.id==='tl')rep.timeline=e.target.value});
let SM=null;const hist=[];
try{window.claude&&claude.use('sample').then(s=>{SM=s||null},()=>{})}catch(e){}
function sysP(){return `You are ScamSOS, a calm voice helper for people in India who have just fallen for an online scam. Your words are spoken aloud.
Reply with ONLY a JSON object: {"say":"...","fields":{"type":"upi|phone|otp|link|","amt":"","when":"","scam":"","bank":"","utr":"","what":""},"action":"none|call|report"}
Rules:
- "say": at most 2 short sentences, warm, like a kind and steady friend, in ${LG()==='hi-IN'?'simple everyday Hindi (Devanagari script)':'simple English'}. Briefly acknowledge how they feel, never blame them. Vary how you start; never repeat the same phrase twice. Ask only ONE question at a time.
- If they sound panicked, give one calming sentence and then only the single most urgent action. If they sound calmer, collect details.
- If they say something unclear, ask them gently to say it again. If they thank you or say goodbye, wish them well and remind them to keep their proof safe.
- Collect, in this order of usefulness: what happened, amount lost, when, scammer's phone/UPI ID/website, their bank, transaction ID. Skip anything they do not know.
- Safety advice by type. Money sent: call 1930 now, then tell the bank. Phone hacked: turn off mobile data and Wi-Fi first, then call 1930. OTP, PIN or card details shared: call the bank on the number on the card to block it, then 1930. Link clicked: enter nothing more and turn off data.
- Never ask for or repeat OTP, PIN, CVV, full card numbers or passwords. If they start to say them, tell them not to.
- Never promise money will come back. Never claim to be a bank, the police or the government.
- action "call" only if they ask to call or are clearly ready to. action "report" only when they agree to make the report and you have the main details. Otherwise "none".
- "fields": copy what is already collected and add anything new they said. type is one of upi, phone, otp, link. amt is digits only.
Collected so far: `+JSON.stringify(rep)}
async function ai(raw){hist.push({role:'user',content:raw});$('#vstat').textContent='Thinking…';orb('speaking');$('#vchips').hidden=true;
try{const r=await SM.json([{role:'user',content:sysP()},...hist.slice(-14)],{modelTier:'quick',cache:false});
hist.push({role:'assistant',content:JSON.stringify(r)});
const f=r.fields||{};['amt','when','scam','bank','utr','what'].forEach(k=>{if(f[k])rep[k]=k==='amt'?String(f[k]).replace(/\D/g,''):String(f[k])});
const ty=TYPES.find(x=>x.id===f.type);if(ty)rep.type=ty.title;
const a=r.action,s=String(r.say||'I am here with you. Tell me more.');
if(a==='call')say(s,()=>{try{$('#vcall').click()}catch(e){}});else if(a==='report')say(s,()=>{vclose();go('report')});else say(s,listen)}
catch(e){hist.pop();orb('');const perm=['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code),s=SM;SM=null;handle(raw,1);if(!perm)SM=s}}
$('#vlang').addEventListener('change',()=>voiceAct('open'));
$('#vtxt').addEventListener('keydown',e=>{if(e.key==='Enter')voiceAct('send')});
render();
</script>
</body>
</html>
